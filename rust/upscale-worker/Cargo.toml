[package]
name = "gputool-upscale"
version = "0.2.0"
edition = "2021"
description = "GPU-only x2-апскейл (SPAN fp16, батчи, NVDEC/NVENC) для GPU tool"
license = "MIT"

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "cuda", "tensorrt", "half", "api-22"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
