[package]
name = "gputool-face"
version = "0.1.0"
edition = "2021"
description = "Быстрый воркер лиц (YuNet + SFace) для плагина GPU tool"
license = "MIT"

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "cuda", "api-22"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
